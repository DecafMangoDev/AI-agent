[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent"
version = "0.1.0"
description = "Reliable coding agent runtime with tool calling"
requires-python = ">=3.9"

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["workspace"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent"]
